<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <title>LASERTOOL v6.14</title>
  <link rel="stylesheet" href="style.css?v=6.14" />
</head>
<body>

  <!-- 進入前模式選擇 -->
  <div id="modeGate" class="mode-gate">
    <div class="mode-gate-card">

      <div class="school-brand">
        <div class="school-logo-wrap">
          <img
            class="school-logo"
            src="https://upload.wikimedia.org/wikipedia/zh/thumb/e/e6/%E9%AB%98%E9%9B%84%E5%B8%82%E7%AB%8B%E5%85%AD%E9%BE%9C%E9%AB%98%E4%B8%AD.png/250px-%E9%AB%98%E9%9B%84%E5%B8%82%E7%AB%8B%E5%85%AD%E9%BE%9C%E9%AB%98%E4%B8%AD.png"
            alt="六龜高中 LOGO"
            referrerpolicy="no-referrer"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';"
          />
          <span class="school-logo-fallback" aria-hidden="true">六中</span>
        </div>
        <div class="school-brand-text">
          <strong>六龜高中</strong>
          <span>科技教育推動小組</span>
        </div>
      </div>
      <div class="mode-gate-logo mode-gate-logo-centered">LASERTOOL</div>
      <h1>請先選擇處理模式</h1>
      <p>選擇後會進入對應工具介面，也可以隨時返回重新選擇。</p>

      <div class="mode-choice-grid">
        <button class="mode-choice" data-enter-mode="halftone" type="button" onclick="LASERTOOL_ENTER('halftone')">
          <span class="mode-choice-icon">◉</span>
          <strong>網點模式</strong>
          <small>適合照片、陰影、雷雕灰階效果</small>
        </button>

        <button class="mode-choice" data-enter-mode="lineart" type="button" onclick="LASERTOOL_ENTER('lineart')">
          <span class="mode-choice-icon">✎</span>
          <strong>黑線稿模式</strong>
          <small>自動描邊、去除雜點、輸出輪廓</small>
        </button>
      </div>
    </div>
  </div>

  <main class="app" id="mainApp" hidden>
    <section class="panel controls">

      <div class="app-school-brand">
        <div class="app-school-logo-wrap">
          <img class="app-school-logo"
               src="https://upload.wikimedia.org/wikipedia/zh/thumb/e/e6/%E9%AB%98%E9%9B%84%E5%B8%82%E7%AB%8B%E5%85%AD%E9%BE%9C%E9%AB%98%E4%B8%AD.png/250px-%E9%AB%98%E9%9B%84%E5%B8%82%E7%AB%8B%E5%85%AD%E9%BE%9C%E9%AB%98%E4%B8%AD.png"
               alt="六龜高中 LOGO" referrerpolicy="no-referrer"
               onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';" />
          <span class="app-school-logo-fallback" aria-hidden="true">六中</span>
        </div>
        <div class="app-school-brand-text">
          <strong>六龜高中</strong>
          <span>科技教育推動小組</span>
        </div>
      </div>

      <div class="title-wrap">
        <div class="title-row">
          <div>
            <h1>雷雕圖片轉換器 v6.14</h1>
            <p id="modeDesc">目前模式：網點模式</p>
          </div>
          <button id="backModeBtn" class="back-mode-btn" type="button">← 重選模式</button>
        </div>
      </div>

      <label class="upload-box" id="dropZone" for="fileInput">
        <span class="upload-title">點一下或拖曳圖片到這裡</span>
        <span class="upload-sub">JPG、PNG、WEBP</span>
        <input id="fileInput" type="file" accept="image/*" />
      </label>

      <!-- 網點 -->
      <div id="halftoneControls">
        <div class="control-group">
          <div class="control-head">
            <label for="threshold">臨界值</label>
            <output id="thresholdValue">128</output>
          </div>
          <input id="threshold" type="range" min="0" max="255" value="128" />
        </div>

        <div class="control-group">
          <div class="control-head">
            <label for="cellSize">網點大小</label>
            <output id="cellSizeValue">8 px</output>
          </div>
          <input id="cellSize" type="range" min="3" max="32" value="8" />
        </div>

        <div class="control-group">
          <div class="control-head">
            <label for="contrast">對比</label>
            <output id="contrastValue">0</output>
          </div>
          <input id="contrast" type="range" min="-100" max="100" value="0" />
        </div>

        <div class="control-group">
          <div class="control-head">
            <label for="angle">網點角度</label>
            <output id="angleValue">45°</output>
          </div>
          <input id="angle" type="range" min="0" max="180" value="45" />
        </div>

        <div class="control-group">
          <div class="control-head">
            <label for="density">密度</label>
            <output id="densityValue">100%</output>
          </div>
          <input id="density" type="range" min="40" max="180" value="100" />
        </div>

        <div class="control-group">
          <div class="group-label">網點形狀</div>
          <div class="shape-grid">
            <button class="shape-btn active" data-shape="dots" type="button">圓點</button>
            <button class="shape-btn" data-shape="lines" type="button">線條</button>
            <button class="shape-btn" data-shape="diamond" type="button">菱形</button>
            <button class="shape-btn" data-shape="square" type="button">方形</button>
          </div>
        </div>
      </div>

      <!-- 線稿 -->
      <div id="lineartControls" hidden>
        <div class="control-group">
          <div class="control-head">
            <label for="edgeSensitivity">邊緣靈敏度</label>
            <output id="edgeSensitivityValue">90</output>
          </div>
          <input id="edgeSensitivity" type="range" min="20" max="220" value="90" />
          <div class="hint">數值越低，抓到的細節越多。</div>
        </div>

        <div class="control-group">
          <div class="control-head">
            <label for="lineWidth">線條粗細</label>
            <output id="lineWidthValue">2</output>
          </div>
          <input id="lineWidth" type="range" min="1" max="6" value="2" />
        </div>

        <div class="control-group">
          <div class="control-head">
            <label for="smooth">平滑程度</label>
            <output id="smoothValue">1</output>
          </div>
          <input id="smooth" type="range" min="0" max="4" value="1" />
        </div>

        <div class="control-group">
          <div class="control-head">
            <label for="detailFilter">去除小雜點</label>
            <output id="detailFilterValue">2</output>
          </div>
          <input id="detailFilter" type="range" min="0" max="5" value="2" />
        </div>

        <label class="toggle-row">
          <span>只保留主要輪廓</span>
          <input id="majorOutline" type="checkbox">
        </label>
      </div>

      <div class="toggle-grid">
        <label class="toggle-row">
          <span>黑白反轉</span>
          <input id="invert" type="checkbox">
        </label>
        <label class="toggle-row">
          <span>增加外框</span>
          <input id="outlineMode" type="checkbox">
        </label>

        <div id="outlineControls" class="outline-controls" hidden>
          <div class="control-head">
            <label for="outlineExpand">外框外擴比例</label>
            <output id="outlineExpandValue">5%</output>
          </div>
          <input id="outlineExpand" type="range" min="1" max="50" value="5" />
          <div class="hint">圖片匯入時就會先預留最大外框空間；之後調整外擴比例時，圖片位置與畫布大小不會跳動。</div>
        </div>      </div>

      <div class="buttons export-buttons">
        <button id="jpgBtn" class="primary" disabled>輸出 JPG</button>
        <button id="pngBtn" class="primary" disabled>透明 PNG</button>
        <button id="dxfBtn" class="accent" disabled>DXF 外框</button>
        <button id="resetBtn" class="secondary" disabled>恢復預設</button>
      </div>

      <p class="privacy-note">
        所有圖片都只在瀏覽器中處理，不會上傳伺服器。
      </p>
    </section>

    <section class="panel preview-panel">
      <div class="preview-header">
        <div class="preview-title-actions">
          <h2>預覽</h2>
          <button id="toggleOriginalBtn" class="preview-toggle-btn" type="button" disabled>查看原圖</button>
          <button id="zoomOutBtn" class="preview-toggle-btn" type="button" disabled>－</button>
          <button id="zoomResetBtn" class="preview-toggle-btn" type="button" disabled>100%</button>
          <button id="zoomInBtn" class="preview-toggle-btn" type="button" disabled>＋</button>
        </div>
        <span id="imageInfo">尚未載入圖片</span>
      </div>

      <div class="preview-box result-box">
        <div class="preview-label" id="resultLabel">處理結果</div>
        <div id="previewViewport" class="canvas-wrap preview-viewport">
          <div class="empty-state" id="emptyState">
            <div class="empty-icon">▧</div>
            <strong>請先上傳圖片</strong>
            <span>處理結果會顯示在這裡</span>
          </div>
          <div id="canvasStage" class="canvas-stage">
            <canvas id="canvas" hidden></canvas>
          </div>
        </div>
      </div>
    </section>
  </main>

  <canvas id="sourceCanvas" hidden></canvas>
  <canvas id="alphaCanvas" hidden></canvas>


  <script>
    // v5.3：模式切換使用獨立函式，避免舊版 app.js 快取造成按鈕無反應。
    window.LASERTOOL_ENTER = function(mode) {
      var gate = document.getElementById("modeGate");
      var app = document.getElementById("mainApp");
      var halftone = document.getElementById("halftoneControls");
      var lineart = document.getElementById("lineartControls");
      var desc = document.getElementById("modeDesc");
      var label = document.getElementById("resultLabel");

      if (gate) gate.hidden = true;
      if (app) app.hidden = false;

      var isHalftone = mode === "halftone";
      if (halftone) halftone.hidden = !isHalftone;
      if (lineart) lineart.hidden = isHalftone;
      if (desc) desc.textContent = isHalftone ? "目前模式：網點模式" : "目前模式：黑線稿模式";
      if (label) label.textContent = isHalftone ? "網點結果" : "黑線稿結果";

      window.LASERTOOL_SELECTED_MODE = mode;
      window.dispatchEvent(new CustomEvent("lasertool-mode-change", { detail: { mode: mode } }));
    };
  </script>

  <script src="app.js?v=6.14"></script>
</body>
</html>
