<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d0f12" />
  <title>LASERTOOL v4</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">LT</div>
        <div>
          <h1>LASERTOOL</h1>
          <span>雷雕圖片轉換器 v4</span>
        </div>
      </div>

      <label class="upload-card" id="dropZone" for="fileInput">
        <div class="upload-icon">＋</div>
        <div>
          <strong>上傳或拖曳圖片</strong>
          <span>JPG / PNG / WEBP</span>
        </div>
        <input id="fileInput" type="file" accept="image/*" />
      </label>

      <section class="tool-section">
        <div class="section-title">快速模式</div>
        <div class="preset-grid">
          <button class="preset-btn" data-preset="photo">照片網點</button>
          <button class="preset-btn" data-preset="line">黑白線稿</button>
          <button class="preset-btn" data-preset="laser">雷雕清晰</button>
          <button class="preset-btn" data-preset="dxf">DXF 輪廓</button>
        </div>
      </section>

      <section class="tool-section">
        <div class="section-title">處理模式</div>
        <div class="segmented">
          <button class="mode-btn active" data-mode="halftone">網點</button>
          <button class="mode-btn" data-mode="lineart">黑線稿</button>
        </div>
      </section>

      <div class="settings-scroll">
        <section id="halftoneControls" class="tool-section">
          <div class="section-title">網點設定</div>

          <div class="shape-grid">
            <button class="shape-btn active" data-shape="dots">圓點</button>
            <button class="shape-btn" data-shape="lines">線條</button>
            <button class="shape-btn" data-shape="diamond">菱形</button>
            <button class="shape-btn" data-shape="square">方形</button>
          </div>

          <div class="range-row">
            <div><label>臨界值</label><output id="thresholdValue">128</output></div>
            <input id="threshold" type="range" min="0" max="255" value="128" />
          </div>
          <div class="range-row">
            <div><label>網點大小</label><output id="cellSizeValue">8 px</output></div>
            <input id="cellSize" type="range" min="3" max="32" value="8" />
          </div>
          <div class="range-row">
            <div><label>對比</label><output id="contrastValue">0</output></div>
            <input id="contrast" type="range" min="-100" max="100" value="0" />
          </div>

          <details class="advanced">
            <summary>進階調整</summary>
            <div class="range-row">
              <div><label>網點角度</label><output id="angleValue">45°</output></div>
              <input id="angle" type="range" min="0" max="180" value="45" />
            </div>
            <div class="range-row">
              <div><label>密度</label><output id="densityValue">100%</output></div>
              <input id="density" type="range" min="40" max="180" value="100" />
            </div>
          </details>
        </section>

        <section id="lineartControls" class="tool-section" hidden>
          <div class="section-title">黑線稿設定</div>

          <div class="range-row">
            <div><label>邊緣靈敏度</label><output id="edgeSensitivityValue">90</output></div>
            <input id="edgeSensitivity" type="range" min="20" max="220" value="90" />
          </div>
          <div class="range-row">
            <div><label>線條粗細</label><output id="lineWidthValue">2</output></div>
            <input id="lineWidth" type="range" min="1" max="6" value="2" />
          </div>
          <div class="range-row">
            <div><label>平滑程度</label><output id="smoothValue">1</output></div>
            <input id="smooth" type="range" min="0" max="4" value="1" />
          </div>
          <div class="range-row">
            <div><label>去除小雜點</label><output id="detailFilterValue">2</output></div>
            <input id="detailFilter" type="range" min="0" max="5" value="2" />
          </div>

          <label class="switch-row">
            <span>只保留主要輪廓</span>
            <input id="majorOutline" type="checkbox">
          </label>
        </section>

        <section class="tool-section">
          <div class="section-title">一般設定</div>
          <label class="switch-row">
            <span>黑白反轉</span>
            <input id="invert" type="checkbox">
          </label>
          <label class="switch-row">
            <span>雷雕模式</span>
            <input id="laserMode" type="checkbox">
          </label>
          <label class="switch-row">
            <span>原圖對照</span>
            <input id="compareMode" type="checkbox">
          </label>
        </section>
      </div>

      <div class="sidebar-footer">
        <button id="resetBtn" class="ghost" disabled>重設參數</button>
      </div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div>
          <strong id="resultLabel">網點結果</strong>
          <span id="imageInfo">尚未載入圖片</span>
        </div>

        <div class="view-actions">
          <button id="fitBtn" disabled>適合畫面</button>
          <button id="zoomOutBtn" disabled>－</button>
          <span id="zoomValue">100%</span>
          <button id="zoomInBtn" disabled>＋</button>
        </div>
      </header>

      <section class="stage" id="stage">
        <div class="empty-state" id="emptyState">
          <div class="empty-art">▧</div>
          <strong>開始處理圖片</strong>
          <span>從左側上傳一張圖片</span>
        </div>

        <div class="canvas-stage" id="canvasStage" hidden>
          <div class="compare-pane" id="comparePane" hidden>
            <div class="canvas-card">
              <div class="canvas-tag">原圖</div>
              <canvas id="originalCanvas"></canvas>
            </div>
          </div>

          <div class="canvas-card">
            <div class="canvas-tag" id="canvasTag">處理結果</div>
            <canvas id="canvas"></canvas>
          </div>
        </div>
      </section>

      <footer class="exportbar">
        <div class="export-info">輸出目前畫面結果</div>
        <div class="export-actions">
          <button id="jpgBtn" class="export-btn" disabled>JPG</button>
          <button id="pngBtn" class="export-btn" disabled>透明 PNG</button>
          <button id="dxfBtn" class="export-btn primary" disabled>DXF 向量</button>
        </div>
      </footer>
    </main>
  </div>

  <canvas id="sourceCanvas" hidden></canvas>
  <canvas id="alphaCanvas" hidden></canvas>
  <script src="app.js"></script>
</body>
</html>
